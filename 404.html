<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Return to the Star Atlas homepage, game overview, or support hub.">

    <meta name="theme-color" content="#04060c">
    <link rel="icon" type="image/png" href="Icon.png">

    <link rel="stylesheet" href="styles.css">
