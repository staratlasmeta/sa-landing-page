name: deploy

on:
  push:
    branches: [ 'main' ]

permissions:
  contents: read
  id-token: write

jobs:
  dev-build-deploy:
    runs-on: warp-ubuntu-latest-x64-4x
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - name: Build static site for dev
        uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}
      - name: Create dummy landing page for dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Star Atlas</title>
            <style>
              html,body{height:100%;margin:0}
              body{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
              .wrap{text-align:center;padding:2rem}
              h1{letter-spacing:.08em;margin:.2rem 0;font-weight:700}
              p{opacity:.8;letter-spacing:.06em}
              .logo{width:160px;opacity:.9;filter:invert(1)}
            </style>
          </head>
          <body>
            <div class="wrap">
              <img class="logo" src="/Logo.svg" alt="Logo" onerror="this.style.display='none'" />
              <h1>Star Atlas</h1>
              <p>Coming soon...</p>
            </div>
          </body>
          </html>
          HTML
      - name: Deploy to dev
        uses: ./.github/actions/deploy
        with:
          gcp-auth-key: ${{ secrets.GCP_AUTH_KEY }}
          bucket-name: 'www.dev.staratlas.cloud'
          src-dir: dist

  prod-build-deploy:
    runs-on: warp-ubuntu-latest-x64-4x
    environment: prod
    needs: [ dev-build-deploy ]
    steps:
      - uses: actions/checkout@v5
      - name: Build static site for prod
        uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}
      - name: Create dummy landing page for prod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Star Atlas</title>
            <style>
              html,body{height:100%;margin:0}
              body{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
              .wrap{text-align:center;padding:2rem}
              h1{letter-spacing:.08em;margin:.2rem 0;font-weight:700}
              p{opacity:.8;letter-spacing:.06em}
              .logo{width:160px;opacity:.9;filter:invert(1)}
            </style>
          </head>
          <body>
            <div class="wrap">
              <img class="logo" src="/Logo.svg" alt="Logo" onerror="this.style.display='none'" />
              <h1>Star Atlas</h1>
              <p>Coming soon...</p>
            </div>
          </body>
          </html>
          HTML
      - name: Deploy to prod
        uses: ./.github/actions/deploy
        with:
          gcp-auth-key: ${{ secrets.GCP_AUTH_KEY }}
          bucket-name: 'www.staratlas.com'
          src-dir: dist
