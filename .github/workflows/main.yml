name: deploy

on:
  push:
    branches: [ 'main' ]

jobs:
  release:
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      matrix:
        environment: [ dev, prod ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Build static site
        uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.environment }}
          path: dist/

  deploy-dev:
    needs: [ release ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'dev'
      bucket-name: 'www.dev.staratlas.cloud'
      artifact-name: 'dist-dev'
      use-dummy-landing: true
      dummy-title: 'Star Atlas'
      dummy-message: 'Coming soon...'
    secrets: inherit

  deploy-prod:
    needs: [ deploy-dev, release ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'prod'
      bucket-name: 'www.staratlas.com'
      artifact-name: 'dist-prod'
      use-dummy-landing: true
      dummy-title: 'Star Atlas'
      dummy-message: 'Coming soon...'
    secrets: inherit
