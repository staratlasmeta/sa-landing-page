name: deploy

on:
  push:
    branches: [ 'main' ]

jobs:
  build-dev:
    runs-on: warp-ubuntu-latest-x64-4x
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - name: Build static site for dev
        uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}
      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-dev
          path: dist/

  deploy-dev:
    needs: [ build-dev ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'dev'
      bucket-name: 'www.dev.staratlas.cloud'
      artifact-name: 'dist-dev'
      use-dummy-landing: true
      dummy-title: 'Star Atlas'
      dummy-message: 'Coming soon...'
    secrets: inherit

  build-prod:
    runs-on: warp-ubuntu-latest-x64-4x
    environment: prod
    needs: [ deploy-dev ]
    steps:
      - uses: actions/checkout@v5
      - name: Build static site for prod
        uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}
      - name: Upload prod artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-prod
          path: dist/

  deploy-prod:
    needs: [ build-prod ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'prod'
      bucket-name: 'www.staratlas.com'
      artifact-name: 'dist-prod'
      use-dummy-landing: true
      dummy-title: 'Star Atlas'
      dummy-message: 'Coming soon...'
    secrets: inherit
