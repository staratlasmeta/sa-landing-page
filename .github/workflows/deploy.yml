name: deploy

on:
  workflow_call:
    inputs:
      bucket-name:
        required: true
        type: string
      environment:
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: dist
    secrets:
      GCP_AUTH_KEY:
        required: true
jobs:

  deploy-api:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
      - uses: ./.github/actions/deploy
        with:
          gcp-auth-key: ${{ secrets.GCP_AUTH_KEY }}
          bucket-name: ${{ inputs.bucket-name }}
          src-dir: dist



