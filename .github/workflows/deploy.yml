name: deploy

on:
  workflow_call:
    inputs:
      bucket-name:
        required: true
        type: string
      environment:
        required: true
        type: string
      artifact-name:
        required: false
        type: string
        default: dist
      use-dummy-landing:
        required: false
        type: boolean
        default: false
      dummy-title:
        required: false
        type: string
        default: 'Star Atlas'
      dummy-message:
        required: false
        type: string
        default: 'Coming soon...'
    secrets:
      GCP_AUTH_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:

  deploy-api:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
      - name: Override index.html with dummy landing (optional)
        if: ${{ inputs.use-dummy-landing }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>${{ inputs.dummy-title }}</title>
            <style>
              html,body{height:100%;margin:0}
              body{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
              .wrap{text-align:center;padding:2rem}
              h1{letter-spacing:.08em;margin:.2rem 0;font-weight:700}
              p{opacity:.8;letter-spacing:.06em}
              .logo{width:160px;opacity:.9;filter:invert(1)}
            </style>
          </head>
          <body>
            <div class="wrap">
              <img class="logo" src="/Logo.svg" alt="Logo" onerror="this.style.display='none'" />
              <h1>${{ inputs.dummy-title }}</h1>
              <p>${{ inputs.dummy-message }}</p>
            </div>
          </body>
          </html>
          HTML
      - uses: ./.github/actions/deploy
        with:
          gcp-auth-key: ${{ secrets.GCP_AUTH_KEY }}
          bucket-name: ${{ inputs.bucket-name }}
          src-dir: dist



