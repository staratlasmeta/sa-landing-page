name: build-lint-test

on:
  merge_group:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-install
        with:
          galaxy-url: ${{ secrets.GALAXY_URL }}