name: 'Deploy to Bucket'

inputs:
  bucket-name:
    required: true
  src-dir:
    required: false
    default: 'dist'
  gcp-auth-key:
    required: true
    description: 'GCP authentication key'

runs:
  using: 'composite'
  steps:

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.gcp-auth-key }}

    - uses: google-github-actions/setup-gcloud@v2

    - shell: bash
      run: |
        # Sync all files to bucket (with delete for removed files)
        gsutil -m rsync -r -d ${{ inputs.src-dir }}/ gs://${{ inputs.bucket-name }}/
        
        # Set long cache (180 days) for static assets by default
        gsutil -m setmeta -h "Cache-Control:public,max-age=15552000" "gs://${{ inputs.bucket-name }}/**"
        
        # Override with no-cache for files that change frequently
        gsutil setmeta -h "Cache-Control:no-cache,max-age=0" gs://${{ inputs.bucket-name }}/index.html
        gsutil setmeta -h "Cache-Control:no-cache,max-age=0" gs://${{ inputs.bucket-name }}/src/main.js
        gsutil setmeta -h "Cache-Control:no-cache,max-age=0" gs://${{ inputs.bucket-name }}/styles.css
        
        # Set no-cache for all HTML files in subdirectories (game pages, etc.)
        gsutil -m setmeta -h "Cache-Control:no-cache,max-age=0" "gs://${{ inputs.bucket-name }}/**/*.html" || true
